name: Feature
description: A group of tasks, tracked through sub-issues.
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: Set area labels and dependencies (Blocked by) in the sidebar, not in the text.
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: What is true once every sub-issue is closed.
    validations:
      required: true
  - type: textarea
    id: parts
    attributes:
      label: Parts
      description: One line per planned sub-issue. Create each as a Task and add it under this issue as a sub-issue.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design references
      description: Full links to docs on main. Plain text such as "ADR-0002" is not linked.
